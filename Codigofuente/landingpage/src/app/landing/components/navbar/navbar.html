<div class="scroll-progress-bar" [style.width.%]="scrollPercent"></div>

<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="logo-container">
    <div class="logo-icon-wrapper">
      <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="38" height="38">
        <!-- Teal child head outline facing left -->
        <path d="M 52 22 C 38 22, 30 33, 30 43 C 30 48, 32 49, 32 53 C 32 56, 29 57, 29 59 C 29 62, 32 62, 33 64 C 34 66, 32 68, 34 71 C 36 74, 42 74, 46 74 C 50 74, 52 79, 56 81 C 60 83, 67 81, 70 76 C 74 71, 77 61, 74 46 C 70 31, 62 22, 52 22 Z" fill="none" stroke="url(#logo-grad-primary)" stroke-width="4.5" stroke-linecap="round"/>
        <!-- Teal sound/thought waves front -->
        <path d="M 23 36 A 14 14 0 0 0 23 58" fill="none" stroke="url(#logo-grad-secondary)" stroke-width="4" stroke-linecap="round"/>
        <path d="M 16 30 A 22 22 0 0 0 16 64" fill="none" stroke="url(#logo-grad-secondary)" stroke-width="4" stroke-linecap="round"/>
        <!-- Gradients -->
        <defs>
          <linearGradient id="logo-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0d9488" />
            <stop offset="100%" stop-color="#2563eb" />
          </linearGradient>
          <linearGradient id="logo-grad-secondary" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0ea5e9" />
            <stop offset="100%" stop-color="#0d9488" />
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-auti">Auti</span><span class="brand-sense">Sense</span>
    </div>
  </div>

  <!-- Hamburger toggle (mobile) -->
  <button class="mobile-menu-toggle" (click)="toggleMenu()" aria-label="Toggle menu">
    <span class="bar" [class.open]="isMenuOpen"></span>
    <span class="bar" [class.open]="isMenuOpen"></span>
    <span class="bar" [class.open]="isMenuOpen"></span>
  </button>

  <ul class="nav-links" [class.mobile-open]="isMenuOpen">
    <li><a href="#inicio" (click)="closeMenu()">Inicio</a></li>
    <li><a href="#sobre" (click)="closeMenu()">Sobre Nosotros</a></li>
    <li><a href="#contacto" (click)="closeMenu()">Contactanos</a></li>
  </ul>

  <div class="actions" [class.mobile-open]="isMenuOpen">
    <a href="#login" class="btn-login" (click)="closeMenu()">Acceder</a>
    <button class="btn-register-pill">Registrarse</button>
  </div>
</nav>
