<section class="testimonials-section" id="testimonios">
  <div class="test-blur-circle test-blur-1"></div>
  <div class="test-blur-circle test-blur-2"></div>

  <div class="container">
    <div class="testimonials-header reveal-on-scroll fade-only">
      <span class="section-label-tag" style="color:rgba(255,255,255,0.9); background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.2);">Lo que dicen de nosotros</span>
      <h2 class="section-title">Testimonios</h2>
      <p class="section-description">Lo que opinan familias y profesionales de la salud que ya forman parte de nuestra comunidad.</p>
    </div>

    <div class="slider-outer reveal-on-scroll delay-1">
      <div class="slider-track" [style.transform]="'translateX(-' + (currentIndex * 100) + '%)'">
        <div class="testimonial-card" *ngFor="let item of testimonials; let i = index" [class.active]="i === currentIndex">
          <div class="card-quote">"</div>
          <p class="quote-text">{{ item.text }}</p>
          <div class="profile-meta">
            <div class="profile-photo">
              <img [src]="item.photo" [alt]="item.name">
            </div>
            <div class="profile-details">
              <h4>{{ item.name }}</h4>
              <p>{{ item.role }}</p>
            </div>
          </div>
        </div>
      </div>

      <button class="nav-arrow prev-arrow" (click)="prev()" aria-label="Anterior">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <button class="nav-arrow next-arrow" (click)="next()" aria-label="Siguiente">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>

    <div class="dots-indicators reveal-on-scroll delay-2">
      <button *ngFor="let dot of testimonials; let i = index"
        class="dot" [class.active]="i === currentIndex"
        (click)="setSlide(i)" [attr.aria-label]="'Testimonio ' + (i + 1)">
      </button>
    </div>
  </div>
</section>
